name: CI

on:
  pull_request:
    branches:
      - develop
      - master
      - develop-compute_acceleration
  push:
    branches:
      - develop
      - master

jobs:
  # Job for Pull Requests: Runs only on Ubuntu
  test-pr:
    name: Test on Ubuntu (PR)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        # one Python for PRs into the acceleration integration branch, all four elsewhere
        python-version: ${{ fromJSON(github.base_ref == 'develop-compute_acceleration' && '["3.13"]' || '["3.10", "3.11", "3.12", "3.13"]') }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov coverage
          pip install jax   # optional RCAIDE[ad] dependency, so the JAX derivative checks run
          pip install -e .

      - name: Run tests with coverage
        # the JAX derivative checks run in the parallel job below
        run: |
          pytest --cov=RCAIDE --cov-report=xml --cov-config=.coveragerc -v -k "not jax"

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: leadsgroup/RCAIDE_LEADS

  # Job for Pull Requests: the JAX derivative checks, in parallel with the NumPy tests above
  test-pr-jax:
    name: Test JAX derivatives on Ubuntu (PR)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov coverage
          pip install jax
          pip install -e .

      - name: Run JAX derivative checks with coverage
        run: |
          pytest --cov=RCAIDE --cov-report=xml --cov-config=.coveragerc -v -k jax

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: leadsgroup/RCAIDE_LEADS

  # Job for Pushes: Runs on Ubuntu, macOS, and Windows
  test-push:
    name: Test on Multiple OS (Push)
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]
        python-version: ["3.10", "3.11", "3.12","3.13"]

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }} on ${{ matrix.os }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov coverage
          pip install jax   # optional RCAIDE[ad] dependency, so the JAX derivative checks run
          pip install -e .

      - name: Run tests with coverage
        run: |
          pytest --cov=RCAIDE --cov-report=xml --cov-config=.coveragerc -v

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: leadsgroup/RCAIDE_LEADS
