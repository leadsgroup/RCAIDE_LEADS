name: Docs

on:
  pull_request:
    branches:
      - develop
      - master
  push:
    branches:
      - develop
      - master
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e .
          python3 -m pip install "sphinx<8.2"
          python3 -m pip install sphinx-rtd-theme
          python3 -m pip install sphinx_rtd_theme
          python3 -m pip install sphinx-autobuild
          python3 -m pip install sphinx-autoapi
          python3 -m pip install nbsphinx
          python3 -m pip install sphinx-copybutton
          python3 -m pip install myst-nb
          python3 -m pip install pandoc
          python3 -m pip install nbconvert nbformat jupyter
          python3 -m pip install import_ipynb
          python3 -m pip install pydata-sphinx-theme
       
          
      - name: Execute Tutorial Files
        run: |
          set -u
          failed=0

          mapfile -d '' tutorial_files < <(find Tutorials -type f \( -name '*.py' -o -name '*.ipynb' \) -print0 | sort -z)

          if [ "${#tutorial_files[@]}" -eq 0 ]; then
            echo "No tutorial files (.py/.ipynb) found under Tutorials/"
            exit 0
          fi

          for file in "${tutorial_files[@]}"; do
            file_dir="$(dirname "$file")"
            file_name="$(basename "$file")"
            echo "Running $file"

            case "$file" in
              *.py)
                if ! (cd "$file_dir" && python3 "$file_name"); then
                  echo "::error file=$file::Error executing Python file $file"
                  failed=1
                fi
                ;;
              *.ipynb)
                tmp_dir="$(mktemp -d)"
                if ! (cd "$file_dir" && jupyter nbconvert --to notebook --execute "$file_name" \
                  --output "$tmp_dir/$file_name" \
                  --ExecutePreprocessor.timeout=2400); then
                  echo "::error file=$file::Error executing notebook $file"
                  failed=1
                else
                  mv "$tmp_dir/$file_name" "$file" || {
                    echo "::error file=$file::Error replacing executed notebook $file"
                    failed=1
                  }
                fi
                rm -rf "$tmp_dir"
                ;;
            esac
          done

          if [ "$failed" -ne 0 ]; then
            echo "One or more tutorial files failed."
            exit 1
          fi
        
      - name: Clean Old Docs
        run: |
             # Clean old build files
             rm -rf docs/source/_autosummary
             rm -rf docs/source/tutorials/Optimization docs/source/tutorials/Missions docs/source/tutorials/Performance
  
      - name:  Copy tutorials to Docs
        run: |
             cp -r Tutorials/* docs/source/tutorials/
   
      - name: Build Docs
        run: |
             make -C docs clean html

      - name: Add Custom Domain
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master')
        run: echo "www.docs.rcaide.leadsresearchgroup.com" > docs/build/html/CNAME
        
      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master')
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/build/html


          
          
